:root{--fd:'Baloo 2',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;--ink:#1b2230;--gold:#ffd23f;--xp:#4fb3ff;--hp:#ff4d5e}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2230;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--fb)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#xpbar{position:absolute;left:0;right:0;top:0;height:14px;background:rgba(10,14,22,.55)}
#xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d8bff,#64d2ff);box-shadow:0 0 10px #4fb3ff;transition:width .12s}
#lvl{position:absolute;left:50%;top:2px;transform:translateX(-50%);font:800 11px var(--fd);color:#fff;letter-spacing:.5px;text-shadow:0 1px 2px #000}
#timer{position:absolute;left:50%;top:20px;transform:translateX(-50%);font:800 30px/1 var(--fd);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#stats{position:absolute;right:max(12px,env(safe-area-inset-right));top:22px;display:flex;gap:8px}
.pill{transition:transform .09s;display:flex;align-items:center;gap:6px;background:rgba(10,14,22,.6);color:#fff;border-radius:999px;padding:4px 12px;font:800 17px/1.2 var(--fd)}
#weps{position:absolute;left:max(10px,env(safe-area-inset-left));top:24px;display:flex;flex-wrap:wrap;gap:4px;max-width:220px}
.wi{width:34px;height:34px;border-radius:9px;background:rgba(10,14,22,.6);display:grid;place-items:center;font-size:19px;position:relative;border:2px solid rgba(255,255,255,.25)}
.wi b{position:absolute;right:-3px;bottom:-4px;font:800 10px var(--fd);color:#1b2230;background:var(--gold);border-radius:6px;padding:0 4px;line-height:14px}
.wi.ev{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
#hpw{position:absolute;width:64px;height:9px;border-radius:5px;background:rgba(10,14,22,.65);overflow:hidden;transform:translate(-50%,0);border:1.5px solid rgba(0,0,0,.4)}
#hpw i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4d5e,#ff8a5a)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 160px 40px rgba(255,20,40,0);transition:box-shadow .15s}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner b{display:block;font:800 clamp(30px,7vw,64px)/1 var(--fd);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 30px rgba(255,60,60,.6);letter-spacing:1px}
#banner small{display:inline-block;margin-top:6px;font:800 16px var(--fd);color:#fff;background:rgba(10,14,22,.7);border-radius:10px;padding:3px 12px}
/* seviye kartları */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,10,18,.55);backdrop-filter:blur(2px)}
.ov.on{display:flex}
#lvup .box{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(560px,94vw)}
#lvup h2{margin:0;font:800 clamp(30px,6vw,46px)/1 var(--fd);color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.4)}
#cards{display:flex;gap:12px;width:100%;justify-content:center}
.card{flex:1;max-width:178px;min-height:210px;border-radius:18px;background:linear-gradient(180deg,#fff7e2,#ffe7b0);border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;padding:14px 10px 12px;box-sizing:border-box;cursor:pointer;pointer-events:auto;transform:translateY(30px) scale(.9);opacity:0;animation:cin .32s cubic-bezier(.2,1.5,.4,1) forwards;color:#1b2230;text-align:center;position:relative}
.card:hover{transform:translateY(-4px) scale(1.03)!important}
.card .ic{font-size:44px;line-height:1.1;margin-top:4px}
.card h3{margin:6px 0 2px;font:800 18px/1.1 var(--fd)}
.card .st{font-size:13px;letter-spacing:2px;color:#d9881a;min-height:16px}
.card p{margin:6px 0 0;font:700 13px/1.25 var(--fb);color:#4a3a2a}
.card .new{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#ff4d5e;color:#fff;font:800 11px var(--fd);border-radius:8px;padding:1px 8px}
.card.evo{background:linear-gradient(180deg,#fff2a8,#ffc94a);border-color:#ffd23f;box-shadow:0 0 0 3px #ff9f1a,0 8px 0 rgba(0,0,0,.35)}
.card.evo .new{background:#9b4dff}
@keyframes cin{to{transform:none;opacity:1}}
#end .box{background:linear-gradient(180deg,#2a3346,#1b2230);border:3px solid #3d4a66;border-radius:22px;padding:24px 26px;text-align:center;color:#fff;width:min(420px,90vw);box-shadow:0 12px 0 rgba(0,0,0,.35)}
#end h2{margin:0 0 6px;font:800 42px/1 var(--fd)}
#end .row{display:flex;justify-content:center;gap:10px;margin:14px 0 18px;flex-wrap:wrap}
#end .row .pill{font-size:18px}
.btn{pointer-events:auto;display:inline-block;border:0;border-radius:16px;padding:14px 34px;font:800 24px/1 var(--fd);color:#1b2230;background:linear-gradient(180deg,#ffe36b,#ffb81f);box-shadow:0 6px 0 #c9800c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9800c}
#start .box{text-align:center;color:#fff}
#start h1{margin:0;font:800 clamp(52px,12vw,100px)/.95 var(--fd);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.45),0 0 40px rgba(255,80,60,.5);letter-spacing:2px}
#start h1 span{display:block;color:var(--gold)}
#start p{font:700 16px var(--fb);opacity:.85;margin:10px 0 22px}
#joy{position:fixed;z-index:6;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.25);transform:translate(-50%,-50%);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.3)}
#bosshp{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:min(420px,70vw);display:none;text-align:center}
#bosshp b{font:800 15px var(--fd);color:#fff;text-shadow:0 2px 0 #000}
#bosshp div{height:12px;border-radius:8px;background:rgba(10,14,22,.7);overflow:hidden;border:2px solid rgba(0,0,0,.5);margin-top:2px}
#bosshp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b31b2b,#ff4d5e)}
