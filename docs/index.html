<style>
:root{
  --sky:#e8dcc0; --cream:#fff8e7; --ink:#2b3a2e; --ink-soft:#5d6b60;
  --green:#2f6b3a; --green-soft:#d9efd0; --wood:#b07a3f; --coin:#f2b43c; --coin-ink:#6b4a05;
  --danger:#d9534f; --danger-soft:#fbe0de; --panel:#fffdf7; --line:#e6dcc4;
  --shadow:0 6px 18px rgba(43,58,46,.18);
  --font-display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.chip{background:var(--panel);border-radius:14px;padding:6px 12px;box-shadow:var(--shadow);font-family:var(--font-display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;pointer-events:auto;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--font-body);font-weight:700;font-size:12px;color:var(--ink-soft)}
.coin-dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,var(--coin) 60%,#c98a12);box-shadow:inset 0 0 0 2px rgba(107,74,5,.35)}
.stone-dot{width:16px;height:13px;border-radius:4px;background:linear-gradient(#c4beb0,#8f8a80);box-shadow:inset 0 0 0 2px rgba(60,58,52,.35)}
.log-dot{width:18px;height:12px;border-radius:6px;background:linear-gradient(#c68a4a,#8b5e3c);box-shadow:inset 0 0 0 2px rgba(60,35,15,.35)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chip.enemy{background:#d63a3a;color:#fff}
.chip.loot{background:#fff}
.chip.quest{border:0;cursor:pointer;background:#fff3cf;color:var(--coin-ink)}
.chip.perk{background:#e6e9ff;color:#2b3a8a;font-size:14px}
.perks{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}

.mute{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--panel);border:0;border-radius:14px;width:44px;height:44px;box-shadow:var(--shadow);font-size:20px;cursor:pointer}
.mute{display:flex;align-items:center;justify-content:center}.mute .nomus{position:absolute;right:1px;bottom:1px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #c0392b;font-style:normal;font-size:12px;font-weight:900;line-height:18px;text-align:center;color:#c0392b}.mute .nomus::after{content:'';position:absolute;left:1px;right:1px;top:50%;height:2px;margin-top:-1px;background:#c0392b;transform:rotate(-45deg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.up{border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#fff}
