<title>Ormanın Bekçisi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --sky:#e8dcc0; --cream:#fff8e7; --ink:#2b3a2e; --ink-soft:#5d6b60;
  --green:#2f6b3a; --green-soft:#d9efd0; --wood:#b07a3f; --coin:#f2b43c; --coin-ink:#6b4a05;
  --danger:#d9534f; --danger-soft:#fbe0de; --panel:#fffdf7; --line:#e6dcc4;
  --shadow:0 6px 18px rgba(43,58,46,.18);
  --font-display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.chip{background:var(--panel);border-radius:14px;padding:6px 12px;box-shadow:var(--shadow);font-family:var(--font-display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;pointer-events:auto;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--font-body);font-weight:700;font-size:12px;color:var(--ink-soft)}
.coin-dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,var(--coin) 60%,#c98a12);box-shadow:inset 0 0 0 2px rgba(107,74,5,.35)}
.stone-dot{width:16px;height:13px;border-radius:4px;background:linear-gradient(#c4beb0,#8f8a80);box-shadow:inset 0 0 0 2px rgba(60,58,52,.35)}
.log-dot{width:18px;height:12px;border-radius:6px;background:linear-gradient(#c68a4a,#8b5e3c);box-shadow:inset 0 0 0 2px rgba(60,35,15,.35)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chip.enemy{background:#d63a3a;color:#fff}
.chip.loot{background:#fff}
.chip.quest{border:0;cursor:pointer;background:#fff3cf;color:var(--coin-ink)}
.chip.perk{background:#e6e9ff;color:#2b3a8a;font-size:14px}
.perks{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.intro .perks button{width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:10px 12px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer}
.intro .perks button b{display:block;font-family:var(--font-display);font-size:18px;color:var(--green)}
.intro .perks button small{color:var(--ink-soft);font-weight:700}
.intro .perks button:active{background:#f1fae9}
.chip.quest.done{background:var(--coin);color:#fff;animation:pulse 1.4s ease-in-out infinite}
.q{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.q b{font-family:var(--font-display);font-size:16px;display:block}
.q small{color:var(--ink-soft);font-weight:700}
.q .qb{flex:1}
.q .qbar{height:8px;border-radius:4px;background:#eee4cf;overflow:hidden;margin-top:4px}
.q .qbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd17a,#3d9a55)}
.q.ok{border-color:#8fd17a;background:#f1fae9}
.q .rw{font-family:var(--font-display);font-weight:800;color:var(--coin-ink);white-space:nowrap}
.away{font-size:15px;text-align:left;margin:8px 0 14px}
.away div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:700}
.away b{font-family:var(--font-display);font-size:18px;color:var(--green);white-space:nowrap;margin-left:10px;text-align:right}
.helm{width:18px;height:12px;border-radius:9px 9px 3px 3px;background:#d63a3a;box-shadow:0 3px 0 -1px #9c2323}
.shield{width:16px;height:18px;background:#fff;border-radius:3px 3px 8px 8px;box-shadow:inset 0 0 0 3px #d63a3a,inset 0 0 0 5px #fff}
.bar{height:8px;border-radius:4px;background:#eee4cf;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8fd17a,#3d9a55);transition:width .15s}
.bar.danger i{background:linear-gradient(90deg,#f39c94,var(--danger))}
.btn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--green);color:#fff;border:0;border-radius:18px;padding:12px 18px;font-family:var(--font-display);font-weight:800;font-size:18px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn .badge{background:var(--coin);color:var(--coin-ink);border-radius:10px;padding:0 8px;font-size:13px;display:none}
.btn.has .badge{display:inline-block}
.btn.has{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.mute{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--panel);border:0;border-radius:14px;width:44px;height:44px;box-shadow:var(--shadow);font-size:20px;cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(43,58,46,.25);padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:72%;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{background:#eee4cf;border:0;border-radius:12px;width:36px;height:36px;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.up{border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.up b{font-family:var(--font-display);font-size:17px;display:flex;justify-content:space-between}
.up b span{color:var(--ink-soft);font-size:13px;font-weight:700}
.up p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.3;min-height:34px}
.up button{margin-top:auto;border:0;border-radius:12px;padding:9px 10px;font-family:var(--font-display);font-weight:800;font-size:16px;background:var(--coin);color:var(--coin-ink);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
.up button:disabled{background:#eee4cf;color:#9a9282;cursor:default}
.up button .coin-dot{width:14px;height:14px}
.up.max button{background:var(--green-soft);color:var(--green)}
.tip{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(43,58,46,.85);color:#fff;padding:8px 14px;border-radius:14px;font-weight:700;font-size:14px;pointer-events:none;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s}
.tip.hide{opacity:0}
.float{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--coin-ink);text-shadow:0 1px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);z-index:4;white-space:nowrap}
.float.red{color:var(--danger)}
.float.green{color:var(--green)}
.joy{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);transform:translate(-50%,-50%);pointer-events:none;z-index:4;display:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:max-content;max-width:min(88vw,460px);box-sizing:border-box;background:var(--danger);color:#fff;padding:10px 18px;border-radius:14px;font-family:var(--font-display);font-weight:800;font-size:18px;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
.toast.good{background:var(--green)}
.mini{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:14px;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.7);z-index:5;touch-action:none;background:#d7b989}
.recenter{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:var(--panel);color:var(--ink);border:0;border-radius:14px;padding:9px 14px;font-family:var(--font-display);font-weight:800;font-size:15px;box-shadow:var(--shadow);cursor:pointer;display:none}
.recenter.show{display:block}
.intro{position:fixed;inset:0;z-index:30;background:rgba(43,58,46,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.intro .card{background:var(--panel);border-radius:24px;padding:22px 22px 18px;max-width:424px;width:100%;box-shadow:var(--shadow);text-align:center}
.intro h1{font-family:var(--font-display);font-size:34px;margin:0 0 6px;color:var(--green);line-height:1.05;text-wrap:balance}
.intro p{margin:0 0 14px;color:var(--ink-soft);font-weight:700;line-height:1.4}
.intro button{width:100%;border:0;border-radius:16px;padding:14px;background:var(--green);color:#fff;font-family:var(--font-display);font-size:20px;font-weight:800;cursor:pointer}
.intro .stars{font-size:34px;color:var(--coin);letter-spacing:6px;margin-bottom:4px;text-shadow:0 2px 0 #b8860b}
.intro .sub{font-size:12px;margin-top:10px;color:var(--ink-soft)}
.guide{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:4;background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:800;font-size:15px;padding:5px 12px;border-radius:12px;white-space:nowrap;box-shadow:var(--shadow)}
.bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:5;background:rgba(20,24,34,.94);color:#fff;font-family:var(--font-display);padding:8px 14px 9px;border-radius:14px;max-width:min(260px,70vw);box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.18);text-align:center;line-height:1.25}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:8px solid transparent;border-top-color:rgba(20,24,34,.94);border-bottom:0}
.bubble b{display:block;font-size:16px;font-weight:800;color:#ffd75e}
.bubble span{display:block;font-family:var(--font-body);font-size:13px;font-weight:600;opacity:.92;margin-top:2px;white-space:normal}
.bubble em{display:block;font-style:normal;font-size:13px;font-weight:800;margin-top:4px;color:#8ee38f}
.bubble i{font-style:normal;font-size:12px;color:#fff;opacity:.8;font-weight:700}
.bubble .bb{display:flex;gap:6px;justify-content:center;margin-top:7px;pointer-events:auto}
.bubble button{font-family:var(--font-display);font-weight:800;font-size:14px;border:0;border-radius:10px;padding:7px 12px;background:#38b95d;color:#fff;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 #23803d}
.bubble button.off{background:#556;box-shadow:0 3px 0 #334;opacity:.85}
.bubble button[data-act=no]{background:#d9534f;box-shadow:0 3px 0 #9c2f2c}
.bubble button:active{transform:translateY(2px);box-shadow:none}
.guide::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.wl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:3;background:rgba(255,253,247,.92);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:14px;padding:4px 10px;border-radius:10px;white-space:nowrap;text-align:center;line-height:1.15;box-shadow:0 2px 8px rgba(43,58,46,.18)}
.wl.pad{background:rgba(43,58,46,.88);color:#fff;font-size:11px;padding:3px 7px;border-radius:9px;transform:translate(-50%,-100%);line-height:1.1}
.wl.pad em{font-style:normal;color:#ffd23f;font-size:12px}
.wl.pad small{color:#dfe8dd;font-size:12px}
.wl.pad small b{color:#ffd23f}
.wl.pad.can{background:var(--green);box-shadow:0 0 0 3px rgba(255,210,63,.6),var(--shadow)}
.wl small{display:block;font-family:var(--font-body);font-weight:700;font-size:11px;color:var(--ink-soft)}
.hpbar{position:fixed;left:0;top:0;width:34px;height:6px;transform:translate(-50%,-50%);pointer-events:none;z-index:3;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:#ff5f5f;width:100%}
.hpbar.boss{width:70px;height:9px}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(20,40,25,.28) 100%)}
@media (max-width:600px){.mini{width:96px;height:96px}.wl{font-size:12px;padding:3px 8px}.wl.pad{background:rgba(43,58,46,.88);color:#fff;font-size:11px;padding:3px 7px;border-radius:9px;transform:translate(-50%,-100%);line-height:1.1}
.wl.pad em{font-style:normal;color:#ffd23f;font-size:12px}
.wl.pad small{color:#dfe8dd;font-size:12px}
.wl.pad small b{color:#ffd23f}
.wl.pad.can{background:var(--green);box-shadow:0 0 0 3px rgba(255,210,63,.6),var(--shadow)}
.wl small{font-size:10px}.guide{font-size:13px;padding:4px 10px}.chip{font-size:16px;padding:5px 10px}}
@media (prefers-reduced-motion:reduce){.btn.has{animation:none}.sheet{transition:none}}

.chip.perk{font-size:15px;letter-spacing:1px}
.nightBtn{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;border:0;border-radius:18px;padding:12px 20px;background:linear-gradient(#34427a,#1e2850);color:#fff;font-family:var(--font-display);font-weight:800;font-size:19px;box-shadow:0 5px 0 #121a38,var(--shadow);cursor:pointer;display:flex;align-items:center;gap:10px;animation:pulse 1.6s ease-in-out infinite;touch-action:manipulation}
.nightBtn span{background:var(--coin);color:var(--coin-ink);border-radius:10px;padding:1px 9px;font-size:15px}
.nightBtn:active{transform:translate(-50%,3px);box-shadow:0 2px 0 #121a38}
.nightBtn{white-space:nowrap}
@media (max-width:600px){.nightBtn{font-size:16px;padding:10px 14px;bottom:calc(122px + env(safe-area-inset-bottom,0px))}.nightBtn span{font-size:13px}}
.banner{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;animation:bannerIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
.banner b{display:block;font-family:var(--font-display);font-weight:800;font-size:clamp(40px,9vw,76px);line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.35);letter-spacing:2px}
.banner small{display:inline-block;margin-top:8px;font-family:var(--font-display);font-weight:800;font-size:18px;color:#fff;background:rgba(20,24,34,.75);padding:4px 14px;border-radius:12px}
.banner.night b{color:#cfd8ff}.banner.boss b{color:#ff6b5f;font-size:clamp(38px,8vw,70px)}.banner.day b{color:#ffe27a}
.banner.out{animation:bannerOut .5s ease forwards}
@keyframes bannerIn{from{transform:translate(-50%,-50%) scale(.6)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes bannerOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-70%) scale(1.05)}}
.intro .cards{display:flex;flex-direction:column;gap:10px;margin:8px 0 2px}
.intro .cards button{display:grid;grid-template-columns:48px 1fr;grid-template-rows:auto auto;align-items:center;text-align:left;border:3px solid #e8d9a8;background:linear-gradient(#fffdf4,#fff4d6);color:var(--ink);border-radius:18px;padding:10px 12px;cursor:pointer;animation:cardIn .35s cubic-bezier(.2,1.5,.4,1) forwards;box-shadow:0 4px 0 #d8c690}
.intro .cards button i{grid-row:1/3;font-style:normal;font-size:32px;text-align:center}
.intro .cards button b{font-family:var(--font-display);font-size:19px;color:var(--green)}
.intro .cards button b em{font-style:normal;color:var(--coin-ink);background:var(--coin);border-radius:8px;padding:0 6px;font-size:14px}
.intro .cards button small{font-weight:700;color:var(--ink-soft);font-size:14px}
.intro .cards button:hover,.intro .cards button:active{border-color:var(--coin);transform:translateY(-2px)}
@keyframes cardIn{from{transform:translateY(24px) scale(.94)}to{transform:none}}
.intro .cards button{opacity:1}
.intro button.ghost{background:transparent;color:var(--ink-soft);font-size:16px;padding:10px;margin-top:4px}
.intro button.gold{background:var(--coin);color:var(--coin-ink);margin-bottom:8px}
.intro button+button{margin-top:8px}
.result .bigstars{font-size:58px;line-height:1;margin:-4px 0 6px;letter-spacing:4px}
.result .bigstars span{display:inline-block;color:#d8cfb8;animation:starPop .45s cubic-bezier(.2,1.8,.4,1) forwards}
.result .bigstars span.on{color:var(--coin);text-shadow:0 3px 0 #b8860b,0 0 18px rgba(255,210,63,.7)}
@keyframes starPop{from{transform:scale(.4)}to{transform:scale(1)}}
.result p b{color:var(--ink)}
.result .crowns{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--coin-ink);background:#fff3cf;border-radius:12px;padding:6px 10px;margin:0 0 12px}
.result.fail h1{color:var(--danger)}
.result .near{font-size:20px;color:var(--ink)}
.result .near b{color:var(--danger);font-size:26px}
.result .prog{position:relative;height:24px;border-radius:12px;background:#eee4cf;overflow:hidden;margin:4px 0 12px}
.result .prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f7c75a,#e8961a);transition:width 1.1s cubic-bezier(.2,.8,.3,1)}
.result .prog span{position:relative;font-family:var(--font-display);font-weight:800;font-size:14px;line-height:24px;color:var(--ink)}
.result .hint{background:#f1fae9;border-radius:12px;padding:8px 10px;color:var(--green);font-size:14px}
.card.map{max-width:484px;text-align:left}
.maphead{display:flex;justify-content:space-between;align-items:center}
.card.map h1{margin:0}.card.map h2{font-family:var(--font-display);font-size:20px;margin:14px 0 6px}
.crowns.big{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--coin-ink);background:#fff3cf;border-radius:14px;padding:4px 12px}
.gift{background:var(--green-soft);color:var(--green);font-weight:800;border-radius:12px;padding:8px 10px;margin:8px 0}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.intro .levels .lv{padding:8px 0 6px;border-radius:14px;background:var(--green);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #1d4a26;margin:0}
.intro .levels .lv b{font-size:22px;line-height:1}.intro .levels .lv small{font-size:12px;color:#ffd23f;letter-spacing:1px;min-height:14px}
.intro .levels .lv.lock{background:#c9c0ac;box-shadow:0 4px 0 #a39a86;cursor:default}
.intro .levels .lv.next{animation:pulse 1.2s ease-in-out infinite;background:#e8961a;box-shadow:0 4px 0 #a86a0e}
.ups{display:flex;flex-direction:column;gap:8px}
.upr{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff}
.upr i{font-style:normal;font-size:26px;text-align:center}.upr b{font-family:var(--font-display);font-size:17px}.upr b span{color:var(--ink-soft);font-size:13px}.upr small{display:block;color:var(--ink-soft);font-weight:700;font-size:13px}
.intro .upr button{width:auto;padding:8px 12px;font-size:16px;background:var(--coin);color:var(--coin-ink);margin:0}
.intro .upr button:disabled{background:#eee4cf;color:#9a9282}
.intro #cont{background:#e8961a;margin:6px 0 2px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:29;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(40px)}}
@media (prefers-reduced-motion:reduce){.nightBtn,.intro .levels .lv.next{animation:none}}
.placeBar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:rgba(20,24,34,.92);color:#fff;border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:15px;box-shadow:var(--shadow);white-space:nowrap}
.placeBar button{border:0;border-radius:12px;padding:8px 12px;background:var(--danger);color:#fff;font-family:var(--font-display);font-weight:800;font-size:15px;cursor:pointer}
@media (max-width:600px){.placeBar{bottom:calc(122px + env(safe-area-inset-bottom,0px));font-size:13px}}
