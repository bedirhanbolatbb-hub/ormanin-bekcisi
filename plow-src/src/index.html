<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plow Crew</title>
<style>
/*FONTS*/
:root{--ink:#2b3a55;--ink2:#53627d;--gold:#ffc23d;--org:#ff8a1e;--grn:#2fb36a;--red:#e5483c;--card:#ffffff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe0f1;touch-action:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
canvas#fx2d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
button{font-family:inherit;border:0;cursor:pointer;pointer-events:auto;touch-action:none;}
#coinBox{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;background:var(--card);padding:6px 16px 6px 7px;border-radius:999px;box-shadow:0 4px 0 rgba(43,58,85,.15),0 8px 22px rgba(43,58,85,.18);}
#coinIco{width:38px;height:38px;}
#coinIco svg,.ci svg{width:100%;height:100%;display:block;}
#coinTxt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:29px;line-height:1;min-width:30px;letter-spacing:.5px;}
#coinBox.bump{animation:bump .18s ease-out;}
@keyframes bump{50%{transform:scale(1.1);}}
#goal{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--card);padding:7px 14px 7px 8px;border-radius:18px;width:min(440px,calc(100vw - 250px));box-shadow:0 4px 0 rgba(43,58,85,.15),0 8px 22px rgba(43,58,85,.18);}
#goal.pop{animation:gpop .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes gpop{0%{transform:translateX(-50%) scale(.7);opacity:.2}100%{transform:translateX(-50%) scale(1);opacity:1}}
#goalIco{width:40px;height:40px;flex:none;background:#eef4fb;border-radius:12px;padding:3px;}
#goalIco svg{width:100%;height:100%;}
#goalMain{flex:1;min-width:0;}
#goalTxt{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#goalBar{height:10px;border-radius:6px;background:#e3eaf3;margin-top:5px;overflow:hidden;}
#goalBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb52e,#ff8a1e);border-radius:6px;transition:width .2s;}
#goalPct{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;min-width:44px;text-align:right;}
#btnMute{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 rgba(43,58,85,.15),0 8px 22px rgba(43,58,85,.18);padding:9px;}
#btnMute svg{width:100%;height:100%;}
#ups{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;}
.up{width:104px;height:108px;border-radius:18px;background:var(--card);box-shadow:0 5px 0 #c9d5e4,0 10px 24px rgba(43,58,85,.2);display:flex;flex-direction:column;align-items:center;padding:7px 6px 6px;position:relative;transition:transform .08s;}
.up:active{transform:translateY(3px);box-shadow:0 2px 0 #c9d5e4,0 6px 14px rgba(43,58,85,.2);}
.ui-ico{width:38px;height:38px;background:#eef4fb;border-radius:12px;padding:4px;}
.ui-ico svg{width:100%;height:100%;display:block;}
.ui-lbl{font-weight:800;font-size:12.5px;margin-top:3px;white-space:nowrap;}
.ui-dots{font-size:8px;letter-spacing:1.5px;color:#ff8a1e;height:11px;line-height:11px;}
.ui-cost{display:flex;align-items:center;gap:3px;margin-top:auto;background:#eef2f7;border-radius:10px;padding:1px 9px 1px 4px;}
.ui-cost .ci{width:17px;height:17px;}
.ui-cost b{font-family:'Baloo 2',sans-serif;font-size:16px;line-height:20px;color:#9aa6b6;}
.up.can .ui-cost{background:var(--grn);}
.up.can .ui-cost b{color:#fff;}
.up.can{box-shadow:0 5px 0 #23935a,0 10px 24px rgba(47,179,106,.35),inset 0 0 0 3px var(--grn);}
.up.max .ui-cost b{color:#ff8a1e;}
.up.bump{animation:upb .35s cubic-bezier(.2,1.8,.4,1);}
@keyframes upb{0%{transform:scale(.85)}100%{transform:scale(1)}}
#ups.nudge .up.can{animation:nud 1s infinite;}
@keyframes nud{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.toolcard{width:118px;background:linear-gradient(#fff8e6,#fff);}
.toolcard .ui-ico{background:#ffe9b8;}
.toolcard .ui-lbl{color:#c26a00;}
.tc-bar{width:86%;height:6px;background:#f1e2c2;border-radius:4px;overflow:hidden;margin-top:4px;}
.tc-bar i{display:block;height:100%;width:0;background:var(--gold);}
.toolcard.can{animation:tcg 1.1s infinite;box-shadow:0 5px 0 #d69a00,0 10px 28px rgba(255,194,61,.6),inset 0 0 0 3px var(--gold);}
.toolcard.can .ui-cost{background:#ff8a1e;}
.toolcard.gift{background:linear-gradient(#eaf6ff,#fff);}
.toolcard.gift .ui-ico{background:#cfe9ff;}
.toolcard.gift .ui-lbl{color:#1f6fb3;}
.toolcard.gift .tc-bar i{background:#4aa8ff;}
.toolcard.gift .ui-cost{background:#4aa8ff;}
.toolcard.gift .ui-cost .ci{display:none;}
.toolcard.gift .ui-cost{padding:1px 9px;}
.toolcard.gift .ui-cost b{color:#fff;font-size:13px;}
.toolcard.lock{background:linear-gradient(#eef1f6,#fff);}
.toolcard.lock .ui-ico{background:#dfe5ee;filter:grayscale(.35);}
.toolcard.lock .ui-lbl{color:#5b6b85;}
.toolcard.lock .tc-bar i{background:#8a95a8;}
.toolcard.lock .ui-cost{background:#8a95a8;padding:1px 9px;}
.toolcard.lock .ui-cost .ci{display:none;}
.toolcard.lock .ui-cost b{color:#fff;font-size:13px;}
.toolcard.arrive{animation:tarr .6s ease-out 4;}
@keyframes tarr{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-3deg);box-shadow:0 0 0 8px rgba(255,194,61,.75),0 10px 28px rgba(255,194,61,.6)}100%{transform:scale(1)}}
@keyframes tcg{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
#tools{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;}
.tool{width:56px;height:56px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 #c9d5e4,0 8px 18px rgba(43,58,85,.18);padding:7px;opacity:.75;}
.tool svg{width:100%;height:100%;}
.tool.pulse{animation:tpulse .7s infinite;opacity:1;}
@keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18);box-shadow:0 0 0 6px rgba(255,194,61,.7),0 8px 18px rgba(43,58,85,.18)}}
.tool.on{opacity:1;box-shadow:0 4px 0 #d69a00,inset 0 0 0 3px var(--gold),0 8px 18px rgba(43,58,85,.18);}
#loadTag{position:absolute;left:0;top:0;display:none;align-items:center;gap:6px;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 9px 3px 4px;box-shadow:0 3px 10px rgba(43,58,85,.25);}
#loadTag.on{display:flex;}
#loadTag .lb{width:54px;height:9px;border-radius:5px;background:#dfe7f1;overflow:hidden;}
#loadTag .lb i{display:block;height:100%;background:linear-gradient(90deg,#ffe27a,#f5a623);}
#loadTag .ci{width:18px;height:18px;display:block;}#loadTag .ci svg{width:100%;height:100%;display:block;}
#loadTag.paid{animation:paid .35s ease-out;}
@keyframes paid{0%{transform-origin:center}40%{filter:brightness(1.3)}100%{filter:none}}
#loadTag b{font-family:'Baloo 2',sans-serif;font-size:14px;line-height:16px;}
#streak{position:absolute;left:0;top:0;display:none;}
#streak.on{display:block;}
#streak .in{position:relative;display:flex;align-items:center;gap:2px;padding:3px 10px 3px 4px;border-radius:999px;background:linear-gradient(180deg,#ffbe45,#ff8a1e);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;line-height:1;text-shadow:0 2px 0 rgba(160,60,0,.35);box-shadow:0 3px 0 #d0600a,0 6px 14px rgba(255,122,26,.45);}
#streak .fl{width:22px;height:22px;display:block;}#streak .fl svg{width:100%;height:100%;display:block;}
#streak b{padding-top:2px;}
#streak .hb{position:absolute;left:12px;right:12px;bottom:-7px;height:4px;border-radius:2px;background:rgba(43,58,85,.25);overflow:hidden;}
#streak .hb i{display:block;height:100%;background:#fff;border-radius:2px;}
#streak.l2 .in{background:linear-gradient(180deg,#ff8a64,#ea3a2a);box-shadow:0 3px 0 #a8221a,0 6px 16px rgba(234,58,42,.5);}
#streak.l3 .in{background:linear-gradient(180deg,#e88aff,#9a3ae8);box-shadow:0 3px 0 #62209e,0 6px 18px rgba(170,70,240,.55);}
#streak.pop .in{animation:spop .45s ease-out;}
@keyframes spop{0%{scale:.4}45%{scale:1.4}100%{scale:1}}
#streak.cold .fl{animation:sblink .32s infinite;}
#streak.cold .hb i{background:#ffe1dc;}
@keyframes sblink{50%{opacity:.25}}
@keyframes fullp{50%{scale:1.12;}}
#hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);background:rgba(30,42,64,.82);color:#fff;font-weight:800;font-size:17px;padding:10px 20px;border-radius:999px;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;}
#hint.on{opacity:1;transform:translateX(-50%) translateY(0);}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:rgba(255,255,255,.95);font-weight:800;font-size:14px;padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .3s;box-shadow:0 4px 14px rgba(43,58,85,.2);}
#toast.on{opacity:1;}
#banner{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.5);text-align:center;opacity:0;pointer-events:none;}
#banner.on{animation:bnr 2.3s forwards;}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.bn-ico{width:64px;height:64px;margin:0 auto -4px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));}
.bn-ico svg{width:100%;height:100%;}
.bn-t{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#fff;line-height:1.05;white-space:nowrap;-webkit-text-stroke:2px #2b3a55;paint-order:stroke fill;text-shadow:0 5px 0 #2b3a55,0 10px 24px rgba(0,0,0,.25);}
.bn-s{display:inline-block;margin-top:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#2b3a55;background:var(--gold);padding:2px 16px;border-radius:999px;box-shadow:0 4px 0 #d69a00;}
#bubbles{position:absolute;inset:0;}
.bubble{position:absolute;left:0;top:0;background:#fff;color:var(--ink);font-weight:800;font-size:15px;padding:8px 13px;border-radius:14px;box-shadow:0 4px 14px rgba(43,58,85,.25);white-space:nowrap;transition:opacity .25s;}
.bubble:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;}
#endcard{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,32,56,.45);pointer-events:auto;z-index:30;}
#endcard.on{display:flex;animation:fadein .4s;}
@keyframes fadein{from{opacity:0}}
.ec{background:#fff;border-radius:24px;padding:24px 28px;text-align:center;max-width:min(420px,90vw);box-shadow:0 10px 40px rgba(0,0,0,.3);}
.ec h2{font-family:'Baloo 2',sans-serif;font-size:34px;margin:0 0 4px;}
.ec p{margin:6px 0;font-weight:700;color:var(--ink2);}
.ec button{margin-top:14px;background:var(--org);color:#fff;font-weight:800;font-size:18px;padding:12px 26px;border-radius:14px;box-shadow:0 5px 0 #c8650a;}
#loading{position:fixed;inset:0;z-index:50;background:linear-gradient(#7aa7dc,#cfe0f1 70%,#eef4fa);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s;}
#loading.off{opacity:0;pointer-events:none;}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:min(19vw,104px);color:#fff;line-height:.95;text-align:center;-webkit-text-stroke:4px #2b3a55;paint-order:stroke fill;text-shadow:0 8px 0 #2b3a55,0 16px 30px rgba(0,0,0,.25);position:relative;}
.logo small{display:block;font-size:.32em;-webkit-text-stroke:2px #2b3a55;color:#ffc23d;margin-top:6px;letter-spacing:1px;}
.lbar{width:min(300px,70vw);height:14px;border-radius:8px;background:rgba(255,255,255,.6);margin-top:34px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.1);}
.lbar i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#ffb52e,#ff8a1e);transition:width .4s;}
#loadmsg{margin-top:12px;font-weight:800;color:#2b3a55;opacity:.7;}
.flakes{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.flakes i{position:absolute;top:-10px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite;}
@keyframes fall{to{transform:translateY(110vh) translateX(30px);}}

/* ---- chapters ---- */
#timer{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 70px);transform:translateX(-50%);display:none;align-items:center;gap:8px;background:#fff;padding:5px 16px 5px 6px;border-radius:999px;box-shadow:0 4px 0 rgba(43,58,85,.15),0 8px 22px rgba(43,58,85,.18);white-space:nowrap;}
#timer.on{display:flex;}
#timer .ti-ico{width:36px;height:36px;flex:none;}
#timer .ti-ico svg{width:100%;height:100%;display:block;}
#timer b{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:27px;line-height:1;min-width:52px;}
#timer span{font-weight:800;font-size:13px;color:#6b7a93;}
#timer.warn{background:#ffe1dc;animation:tw .5s infinite;}
#timer.warn b{color:#e5483c;}
#timer.good{background:#dcf7e6;}
#timer.good b{color:#23935a;}
#timer.late{background:#fff1d6;}
#timer.late b{color:#e08a00;font-size:20px;}
@keyframes tw{50%{transform:translateX(-50%) scale(1.07)}}
#timer .ti-route{position:relative;width:92px;height:8px;border-radius:4px;background:#e3eaf3;display:none;margin:0 2px;}
#timer.route .ti-route{display:block;}
#timer .ti-route i{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);}
#timer .ti-route .rb{background:#ffb81c;}
#timer .ti-route .rm{background:#e5483c;z-index:1;}
#income{position:absolute;left:calc(max(12px,env(safe-area-inset-left)) + 56px);top:calc(max(12px,env(safe-area-inset-top)) + 64px);display:none;align-items:center;gap:4px;background:#2fb36a;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;line-height:1;padding:5px 11px 4px 7px;border-radius:999px;box-shadow:0 3px 0 #23935a,0 6px 16px rgba(47,179,106,.35);}
#income.on{display:flex;}
#income .ci{width:18px;height:18px;}
#income.tick{animation:bump .2s ease-out;}
#btnMap{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 58px);width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:0 4px 0 rgba(43,58,85,.15),0 8px 22px rgba(43,58,85,.18);padding:6px;}
#btnMap svg{width:100%;height:100%;display:block;}
.chov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(43,70,120,.55),rgba(14,22,42,.82));pointer-events:auto;overflow:hidden;}
.chov.on{display:flex;animation:fadein .35s;}
.chwrap{position:relative;display:flex;flex-direction:column;align-items:center;width:min(440px,92vw);max-height:96vh;}
.chnum{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;letter-spacing:2px;color:#2b3a55;background:#ffc23d;padding:2px 16px;border-radius:999px;box-shadow:0 3px 0 #d69a00;}
.chname{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:min(13vw,62px);line-height:1.02;color:#fff;text-align:center;-webkit-text-stroke:3px #2b3a55;paint-order:stroke fill;text-shadow:0 6px 0 #2b3a55,0 12px 26px rgba(0,0,0,.3);margin-top:8px;}
.chname.sm{font-size:min(9vw,40px);}
.chtag{margin-top:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#2b3a55;background:#fff;padding:3px 18px;border-radius:999px;}
.chcard{margin-top:16px;width:100%;background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;}
.chcard p{margin:6px 0 0;font-weight:800;font-size:16px;color:#53627d;}
.chico{width:64px;height:64px;margin:0 auto;background:#eef4fb;border-radius:18px;padding:6px;}
.chico.sm{width:52px;height:52px;margin:0;flex:none;border-radius:14px;}
.chico svg{width:100%;height:100%;display:block;}
.chtwist{margin-top:10px;display:inline-block;background:#fff4dc;color:#c26a00;font-weight:800;font-size:14px;padding:5px 12px;border-radius:12px;}
.chgo{margin-top:18px;background:var(--grn);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;padding:10px 40px;border-radius:18px;box-shadow:0 6px 0 #23935a,0 12px 28px rgba(47,179,106,.45);animation:gopulse 1.1s infinite;}
@keyframes gopulse{50%{transform:scale(1.06)}}
/* the chapter card at the start never blocks: the town shows through, drags go to the game, it starts by itself */
#chIntro.soft{background:radial-gradient(ellipse at 50% 46%,rgba(14,22,42,.55),rgba(14,22,42,.18) 60%,rgba(14,22,42,0) 85%);pointer-events:none;transition:opacity .4s;}
#chIntro.soft .chgo{pointer-events:auto;position:relative;overflow:hidden;touch-action:none;}
#chIntro.soft .chgo::after{content:'';position:absolute;left:14px;right:14px;bottom:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.6);transform-origin:0 50%;animation:chauto 4.7s linear forwards;}
@keyframes chauto{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#chIntro.out{opacity:0;}
#ups{transition:opacity .35s;} body.chsoft #ups{opacity:0;} body.chsoft #ups,body.chsoft #ups *{pointer-events:none !important;}
.chlink{margin-top:12px;background:none;color:#e8f0fb;font-weight:800;font-size:15px;text-decoration:underline;opacity:.9;}
.rays{position:absolute;left:50%;top:30%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,214,90,.16) 0 9deg,rgba(255,214,90,0) 9deg 22deg);animation:spin 14s linear infinite;pointer-events:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.stars{display:flex;align-items:flex-end;gap:6px;margin-top:10px;height:96px;}
.st{width:74px;height:74px;transform:scale(0);}
.st1{width:92px;height:92px;margin-bottom:14px;}
.st svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));}
.st.pop{animation:starin .45s cubic-bezier(.2,1.8,.4,1) forwards;}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.chcard.res{padding:12px 18px;}
.rrow{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;padding:5px 4px;color:#53627d;border-bottom:1px solid #eef2f7;}
.rrow b{font-family:'Baloo 2',sans-serif;font-size:24px;color:#2b3a55;}
.rrow b.gold{color:#e08a00;}
.newbest{margin:8px auto 0;display:inline-block;background:#e5483c;color:#fff;font-weight:800;padding:3px 12px;border-radius:999px;animation:gopulse .8s infinite;}
.chnext{display:flex;align-items:center;gap:12px;margin-top:12px;text-align:left;background:#f3f7fc;border-radius:16px;padding:8px 10px;}
.chnext b{display:block;font-size:16px;}
.chnext span{display:block;font-weight:700;font-size:14px;color:#6b7a93;}
.chback{margin-top:10px;font-weight:800;font-size:14px;color:#2a6fd6;}
.chwrap.map{width:min(460px,94vw);}
.chlist{margin-top:14px;width:100%;display:flex;flex-direction:column;gap:9px;overflow-y:auto;max-height:68vh;padding:2px;}
.chrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:9px 12px;box-shadow:0 5px 0 #c9d5e4;cursor:pointer;}
.chrow.cur{box-shadow:0 5px 0 #d69a00,inset 0 0 0 3px #ffc23d;}
.chrow.locked{opacity:.55;filter:grayscale(.7);}
.chrow.soon{opacity:.8;background:#eef4fb;box-shadow:none;cursor:default;justify-content:center;text-align:center;}
.chinfo{flex:1;min-width:0;}
.chinfo b{display:block;font-size:17px;}
.chinfo span{display:block;font-weight:700;font-size:13px;color:#6b7a93;}
.mstars{display:flex;gap:2px;margin-top:3px;}
.mstars i{width:20px;height:20px;display:block;}
.mstars svg{width:100%;height:100%;}
.chbtn{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:#fff;background:var(--grn);padding:4px 14px;border-radius:12px;box-shadow:0 3px 0 #23935a;}
.chrow.cur .chbtn{background:#ffc23d;color:#2b3a55;box-shadow:0 3px 0 #d69a00;}
.chrow.locked .chbtn{background:#c9d5e4;box-shadow:none;}
#chFade{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#7aa7dc,#cfe0f1 70%,#eef4fa);}
#chFade.on{display:flex;animation:fadein .5s;}
@media (max-width:640px){
  #goal{top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 104px);width:calc(100vw - 24px);padding:6px 12px 6px 7px;}
  #goalIco{width:34px;height:34px;}
  #goalTxt{font-size:14px;}
  .up{width:78px;height:94px;border-radius:15px;padding:5px 3px;}
  .toolcard{width:88px;}
  .ui-ico{width:32px;height:32px;}
  .ui-lbl{font-size:10.5px;}
  .ui-cost b{font-size:14px;}
  #ups{gap:6px;}
  #hint{bottom:auto;top:124px;font-size:15px;}
  #toast{top:170px;}
  #timer{top:calc(max(12px,env(safe-area-inset-top)) + 62px);}
  .bn-t{font-size:32px;}
  #tools{bottom:auto;top:70px;}
  .tool{width:48px;height:48px;}
  #coinTxt{font-size:25px;}
}
@media (max-height:500px){ #hint{bottom:auto;top:70px;} #banner{top:30%;}
  /* short landscape screens (phones on their side, small game frames): slimmer cards so the road stays visible */
  #ups{transform:translateX(-50%) scale(.8);transform-origin:50% 100%;}
  #goal{padding:5px 12px 5px 7px;}
  #goalIco{width:32px;height:32px;}
  .bn-t{font-size:34px;}
  /* the chapter card needs the whole height there */
  #goal{transition:opacity .35s;} body.chsoft #goal{opacity:0;}
}
</style>
</head>

<canvas id="c"></canvas>
<canvas id="fx2d"></canvas>
<div id="hud">
  <div id="coinBox"><div id="coinIco"></div><span id="coinTxt">0</span></div>
  <div id="goal"><div id="goalIco"></div><div id="goalMain"><div id="goalTxt"></div><div id="goalBar"><i></i></div></div><div id="goalPct"></div></div>
  <button id="btnMute" aria-label="sound"></button>
  <div id="tools"></div>
  <div id="ups"></div>
  <div id="loadTag"><span class="ci"></span><div class="lb"><i></i></div><b></b></div>
  <div id="streak"><div class="in"><span class="fl"></span><b>x2</b><div class="hb"><i></i></div></div></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="bubbles"></div>
  <div id="income"><span class="ci"></span><b>+0/s</b></div>
  <div id="timer"><div class="ti-ico"></div><b id="timerTxt">0:30</b><div class="ti-route"><i class="rb"></i><i class="rm"></i></div><span id="timerSub"></span></div>
  <button id="btnMap" aria-label="chapters"></button>
</div>
<div id="chIntro" class="chov"></div><div id="chRes" class="chov"></div><div id="chMap" class="chov"></div><div id="chFade"></div>
