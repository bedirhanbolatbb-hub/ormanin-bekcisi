<style>
:root{
  --sky:#e8dcc0; --cream:#fff8e7; --ink:#2b3a2e; --ink-soft:#5d6b60;
  --green:#2f6b3a; --green-soft:#d9efd0; --wood:#b07a3f; --coin:#f2b43c; --coin-ink:#6b4a05;
  --danger:#d9534f; --danger-soft:#fbe0de; --panel:#fffdf7; --line:#e6dcc4;
  --shadow:0 6px 18px rgba(43,58,46,.18);
  --font-display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.chip{background:var(--panel);border-radius:14px;padding:6px 12px;box-shadow:var(--shadow);font-family:var(--font-display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;pointer-events:auto;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--font-body);font-weight:700;font-size:12px;color:var(--ink-soft)}
.coin-dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,var(--coin) 60%,#c98a12);box-shadow:inset 0 0 0 2px rgba(107,74,5,.35)}
.stone-dot{width:16px;height:13px;border-radius:4px;background:linear-gradient(#c4beb0,#8f8a80);box-shadow:inset 0 0 0 2px rgba(60,58,52,.35)}
.log-dot{width:18px;height:12px;border-radius:6px;background:linear-gradient(#c68a4a,#8b5e3c);box-shadow:inset 0 0 0 2px rgba(60,35,15,.35)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chip.enemy{background:#d63a3a;color:#fff}
.chip.loot{background:#fff}
.chip.quest{border:0;cursor:pointer;background:#fff3cf;color:var(--coin-ink)}
.chip.perk{background:#e6e9ff;color:#2b3a8a;font-size:14px}
.perks{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.intro .perks button{width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:10px 12px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer}
.intro .perks button b{display:block;font-family:var(--font-display);font-size:18px;color:var(--green)}
.intro .perks button small{color:var(--ink-soft);font-weight:700}
.intro .perks button:active{background:#f1fae9}
.chip.quest.done{background:var(--coin);color:#fff;animation:pulse 1.4s ease-in-out infinite}
.q{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.q b{font-family:var(--font-display);font-size:16px;display:block}
.q small{color:var(--ink-soft);font-weight:700}
.q .qb{flex:1}
.q .qbar{height:8px;border-radius:4px;background:#eee4cf;overflow:hidden;margin-top:4px}
.q .qbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd17a,#3d9a55)}
.q.ok{border-color:#8fd17a;background:#f1fae9}
.q .rw{font-family:var(--font-display);font-weight:800;color:var(--coin-ink);white-space:nowrap}
.away{font-size:15px;text-align:left;margin:8px 0 14px}
.away div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:700}
.away .full{color:var(--danger);font-style:normal;font-size:12px}
.away b{font-family:var(--font-display);font-size:18px;color:var(--green);white-space:nowrap;margin-left:10px;text-align:right}
.helm{width:18px;height:12px;border-radius:9px 9px 3px 3px;background:#d63a3a;box-shadow:0 3px 0 -1px #9c2323}
.shield{width:16px;height:18px;background:#fff;border-radius:3px 3px 8px 8px;box-shadow:inset 0 0 0 3px #d63a3a,inset 0 0 0 5px #fff}
.bar{height:8px;border-radius:4px;background:#eee4cf;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8fd17a,#3d9a55);transition:width .15s}
.bar.danger i{background:linear-gradient(90deg,#f39c94,var(--danger))}
.btn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--green);color:#fff;border:0;border-radius:18px;padding:12px 18px;font-family:var(--font-display);font-weight:800;font-size:18px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn .badge{background:var(--coin);color:var(--coin-ink);border-radius:10px;padding:0 8px;font-size:13px;display:none}
.btn.has .badge{display:inline-block}
.btn.has{animation:pulse 1.4s ease-in-out infinite}

.mute{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--panel);border:0;border-radius:14px;width:44px;height:44px;box-shadow:var(--shadow);font-size:20px;cursor:pointer}
.mute{display:flex;align-items:center;justify-content:center}.mute .nomus{position:absolute;right:1px;bottom:1px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #c0392b;font-style:normal;font-size:12px;font-weight:900;line-height:18px;text-align:center;color:#c0392b}.mute .nomus::after{content:'';position:absolute;left:1px;right:1px;top:50%;height:2px;margin-top:-1px;background:#c0392b;transform:rotate(-45deg)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(43,58,46,.25);padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:72%;overflow-y:auto}
.sheet.open{transform:translateY(0)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.up{border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#fff}

.up button{margin-top:auto;border:0;border-radius:12px;padding:9px 10px;font-family:var(--font-display);font-weight:800;font-size:16px;background:var(--coin);color:var(--coin-ink);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}

.up.max button{background:var(--green-soft);color:var(--green)}
.tip{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(43,58,46,.85);color:#fff;padding:8px 14px;border-radius:14px;font-weight:700;font-size:14px;pointer-events:none;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s}
.tip.hide{opacity:0}
.float{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--coin-ink);text-shadow:0 1px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);z-index:4;white-space:nowrap}
.float.red{color:var(--danger)}

.joy{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);transform:translate(-50%,-50%);pointer-events:none;z-index:4;display:none}

.toast{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:max-content;max-width:min(88vw,460px);box-sizing:border-box;background:var(--danger);color:#fff;padding:10px 18px;border-radius:14px;font-family:var(--font-display);font-weight:800;font-size:18px;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}

.mini{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:14px;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.7);z-index:5;touch-action:none;background:#d7b989}
.recenter{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:var(--panel);color:var(--ink);border:0;border-radius:14px;padding:9px 14px;font-family:var(--font-display);font-weight:800;font-size:15px;box-shadow:var(--shadow);cursor:pointer;display:none}

.intro{position:fixed;inset:0;z-index:30;background:rgba(43,58,46,.55);display:flex;align-items:center;justify-content:center;padding:16px}

.guide{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:4;background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:800;font-size:15px;padding:5px 12px;border-radius:12px;white-space:nowrap;box-shadow:var(--shadow)}
.bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:5;background:rgba(20,24,34,.94);color:#fff;font-family:var(--font-display);padding:8px 14px 9px;border-radius:14px;max-width:min(260px,70vw);box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.18);text-align:center;line-height:1.25}

.bubble button{font-family:var(--font-display);font-weight:800;font-size:14px;border:0;border-radius:10px;padding:7px 12px;background:#38b95d;color:#fff;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 #23803d}

.guide::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.wl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:3;background:rgba(255,253,247,.92);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:14px;padding:4px 10px;border-radius:10px;white-space:nowrap;text-align:center;line-height:1.15;box-shadow:0 2px 8px rgba(43,58,46,.18)}

.wl small{display:block;font-family:var(--font-body);font-weight:700;font-size:11px;color:var(--ink-soft)}
.hpbar{position:fixed;left:0;top:0;width:34px;height:6px;transform:translate(-50%,-50%);pointer-events:none;z-index:3;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:#ff5f5f;width:100%}
.hpbar.boss{width:70px;height:9px}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(20,40,25,.28) 100%)}
